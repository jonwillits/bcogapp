name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual re-run from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # macOS, because it is arm64 and the saved Module 2 populations are only
    # reproducible on the architecture that generated them. `rng.normal()` is
    # Box-Muller and so rests on Math.log/sin/cos, which ECMAScript leaves
    # implementation-approximated; a last-bit difference between V8 builds
    # compounds through hundreds of mutations until it changes which creature
    # reproduces. On ubuntu the fixture regeneration test fails with entirely
    # different genomes and a lineage 14 nodes short. The test guards itself with
    # a platform check too, so a runner image that changes arch degrades to a
    # visible skip rather than a blocked deploy.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 LTS. The *build* is not version-sensitive and npm ci pins
          # everything from the lockfile; the fixture tests are sensitive to the
          # architecture but not to the Node version — verified by running them
          # under both 22 and 26 on arm64, which agree bit for bit.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (gate the deploy on the sim tests)
        run: npm run test

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
